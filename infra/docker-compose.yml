# ============================================================
# SynthDraft 开发环境 Docker Compose
# 镜像 tag 均经查询确认（2026-07-25，GitHub Releases / Docker Hub）
# 启动: docker compose --env-file .env up -d
# ============================================================

name: synthdraft

services:
  # ===== PostgreSQL 16 (结构化业务数据) =====
  # Stable: 16.x is current LTS-equivalent major (Docker Hub official)
  postgres:
    image: postgres:16-alpine
    container_name: synthdraft-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-synthdraft}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-synthdraft_dev_pwd}
      POSTGRES_DB: ${POSTGRES_DB:-synthdraft}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-synthdraft} -d ${POSTGRES_DB:-synthdraft}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===== Redis 7 (Celery broker + result backend + WebSocket pubsub) =====
  redis:
    image: redis:7-alpine
    container_name: synthdraft-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===== Qdrant v1.18.3 (向量库，规范条文检索) =====
  # Tag confirmed via GitHub Releases: qdrant/qdrant v1.18.3
  qdrant:
    image: qdrant/qdrant:v1.18.3
    container_name: synthdraft-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===== MinIO RELEASE.2025-09-07T16-13-09Z (对象存储，图纸与生成产物) =====
  # Tag confirmed via GitHub Releases: minio/minio
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: synthdraft-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-synthdraft_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-synthdraft_minio_secret}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web Console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===== Ollama v0.30.6 (本地 LLM/VLM 推理，开发环境) =====
  # Tag confirmed via GitHub Releases: ollama/ollama v0.30.6
  # GPU 支持需安装 NVIDIA Container Toolkit，此处默认 CPU 模式
  ollama:
    image: ollama/ollama:0.30.6
    container_name: synthdraft-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/11434' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ===== vLLM v0.25.0 (高性能 LLM 推理，GPU 节点，P0 可不启用) =====
  # Tag confirmed via GitHub Releases: vllm-project/vllm v0.25.0
  # 默认 profile 不启动；通过 --profile gpu 启用
  vllm:
    image: vllm/vllm-openai:v0.25.0
    container_name: synthdraft-vllm
    restart: unless-stopped
    profiles: ["gpu"]
    # GPU 支持需部署端配置（runtime: nvidia + deploy.resources）
    # runtime: nvidia
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    environment:
      HUGGING_FACE_HUB_TOKEN: ${HUGGING_FACE_HUB_TOKEN:-}
    ports:
      - "8001:8000"
    volumes:
      - vllm_data:/root/.cache/huggingface
    # command: --model Qwen/Qwen2.5-Coder-7B-Instruct --trust-remote-code

  # ===== OpenTelemetry Collector (可选，tracing 汇聚) =====
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.129.1
    container_name: synthdraft-otel
    restart: unless-stopped
    profiles: ["observability"]
    command: ["--config=/etc/otelcol/config.yaml"]
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol/config.yaml:ro

  # ===== Backend FastAPI =====
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: synthdraft-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-synthdraft}:${POSTGRES_PASSWORD:-synthdraft_dev_pwd}@postgres:5432/${POSTGRES_DB:-synthdraft}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      QDRANT_URL: http://qdrant:6333
      MINIO_ENDPOINT: minio:9000
      OLLAMA_HOST_URL: http://ollama:11434
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ../backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # ===== Celery Worker (审图/生成异步任务) =====
  celery_worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: synthdraft-celery-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-synthdraft}:${POSTGRES_PASSWORD:-synthdraft_dev_pwd}@postgres:5432/${POSTGRES_DB:-synthdraft}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      QDRANT_URL: http://qdrant:6333
      MINIO_ENDPOINT: minio:9000
      OLLAMA_HOST_URL: http://ollama:11434
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../backend:/app
    command: celery -A app.celery_app worker --loglevel=info --concurrency=2 -Q reviews,generations,default

  # ===== Celery Beat (定时任务调度，可选) =====
  celery_beat:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: synthdraft-celery-beat
    restart: unless-stopped
    env_file:
      - .env
    environment:
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ../backend:/app
    command: celery -A app.celery_app beat --loglevel=info
    profiles: ["scheduler"]

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  minio_data:
  ollama_data:
  vllm_data:
