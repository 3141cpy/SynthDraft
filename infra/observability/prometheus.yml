# Prometheus 抓取配置
# 文档: https://prometheus.io/docs/prometheus/latest/configuration/configuration/
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # SynthDraft Backend FastAPI（需暴露 /metrics 端点）
  - job_name: "synthdraft-backend"
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8000"]
        labels:
          service: synthdraft-backend

  # Celery Flower（暴露 Celery 队列指标）
  - job_name: "celery-flower"
    metrics_path: /metrics
    static_configs:
      - targets: ["flower:5555"]
        labels:
          service: celery

  # Prometheus 自监控
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # Tempo 自监控
  - job_name: "tempo"
    static_configs:
      - targets: ["tempo:3200"]
